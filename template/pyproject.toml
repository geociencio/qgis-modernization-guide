[project]
name = "my-plugin"
version = "0.1.0"
description = "A modern QGIS plugin template"
readme = "README.md"
# The tooling in [dependency-groups].dev requires Python 3.11+. The plugin still
# targets the Python version shipped by the oldest supported QGIS; keep that
# runtime policy explicit in your README and test matrix.
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = []  # QGIS provides PyQt and GDAL; add only pure-Python runtime deps

[tool.uv]
package = false          # a QGIS plugin is not a pip-installable package
required-version = ">=0.12"

[dependency-groups]
dev = [
    "qgis-manage>=0.16.1",
    "qgis-plugin-analyzer>=1.19.2",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "flake8>=7.0",
    "bandit>=1.7",
    "detect-secrets>=1.4",
    "qgis-stubs>=0.2.0.post1",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-intl>=2.3.2",
    "myst-parser>=2.0.0",
]

[tool.qgis-manager]
qgis_version = 4
max_backups = 1
auto_compile = false

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
    ".venv",
    "venv",
    "build",
    "dist",
    "help",
    "resources/resources.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["resources/resources.py"]
